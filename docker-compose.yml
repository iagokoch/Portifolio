services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"   #formato: host_ip:porta_host:porta_container
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 20s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      CONTACT_EMAIL_ENABLED: ${CONTACT_EMAIL_ENABLED:-false}
      CONTACT_TELEGRAM_ENABLED: ${CONTACT_TELEGRAM_ENABLED:-false}
      CONTACT_DISCORD_ENABLED: ${CONTACT_DISCORD_ENABLED:-false}
      CONTACT_EMAIL_FROM: ${CONTACT_EMAIL_FROM}
      CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO}
      CONTACT_SMTP_USERNAME: ${CONTACT_SMTP_USERNAME}
      CONTACT_SMTP_PASSWORD: ${CONTACT_SMTP_PASSWORD}
      CONTACT_TELEGRAM_BOT_TOKEN: ${CONTACT_TELEGRAM_BOT_TOKEN}
      CONTACT_TELEGRAM_CHAT_ID: ${CONTACT_TELEGRAM_CHAT_ID}
      CONTACT_DISCORD_WEBHOOK_URL: ${CONTACT_DISCORD_WEBHOOK_URL}
    ports:
      - "127.0.0.1:8080:8080"

  web:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8081:80"   # só para teste; sai quando o tunnel entrar (item 12)

volumes:
  postgres_data: