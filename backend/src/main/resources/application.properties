spring.application.name=portifolioapi
spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.notifications.email.workers=1
app.notifications.email.queue-capacity=20
app.notifications.telegram.workers=1
app.notifications.telegram.queue-capacity=20
app.notifications.discord.queue-capacity=20
app.notifications.email.enabled=${CONTACT_EMAIL_ENABLED:false}
app.notifications.telegram.enabled=${CONTACT_TELEGRAM_ENABLED:false}
app.notifications.discord.enabled=${CONTACT_DISCORD_ENABLED:false}
app.notifications.email.from=${CONTACT_EMAIL_FROM:iagon.koch@gmail.com}
app.notifications.email.to=${CONTACT_EMAIL_TO:iagon.koch@gmail.com}

app.notifications.connect-timeout=3s
app.notifications.request-timeout=5s

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${CONTACT_SMTP_USERNAME:}
spring.mail.password=${CONTACT_SMTP_PASSWORD:}

spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.connectiontimeout]=3000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

app.notifications.telegram.bot-token=${CONTACT_TELEGRAM_BOT_TOKEN:}
app.notifications.telegram.chat-id=${CONTACT_TELEGRAM_CHAT_ID:}
app.notifications.discord.webhook-url=${CONTACT_DISCORD_WEBHOOK_URL:}